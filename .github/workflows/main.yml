name: Build Forge Browser

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🏷️ Sincronizar versão com a tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag inválida: $version" }
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Versão do Forge Browser: $version"

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔨 Gerar instalador Forge Browser
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔎 Descobrir versão do Forge Browser
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Versão: $version"

      - name: 📦 Salvar instalador do Actions
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBrowser-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: 🚀 Publicar release com atualização automática
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
