name: Build Forge Browser

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔨 Gerar instalador Forge Browser
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔎 Descobrir versão do Forge Browser
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Versão: $version"

      - name: 📦 Salvar instalador do Actions
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBrowser-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: 🚀 Publicar instalador no GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Forge Browser ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body: |
            # 🔥 Forge Browser

            **O navegador gamer oficial da Forge Studios.**

            ## 🖥️ Download para Windows

            Baixe o instalador `.exe` abaixo e execute-o para instalar o Forge Browser.

            ### Requisitos
            - Windows 10 ou Windows 11
            - 64 bits

            ### Recursos
            - ⚡ Navegação rápida
            - 🔒 Mais privacidade
            - 🎮 Interface gamer
            - ⚙️ Personalização
            - 🔄 Atualizações contínuas

            ---
            **Forge Studios — Games • Apps • Tecnologia**
          files: release/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
