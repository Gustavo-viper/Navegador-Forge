name: Build Forge Browser

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🏷️ Sincronizar versão com a tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag inválida: $version" }
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Versão do Forge Browser: $version"

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🎨 Gerar arte da instalação Forge
        shell: pwsh
        run: .\build\make-installer-assets.ps1

      - name: 🔨 Gerar instalador Forge Browser
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: 🔎 Descobrir versão do Forge Browser
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Versão: $version"

      - name: 📦 Salvar instalador do Actions
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBrowser-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: 🏷️ Criar release/tag válida para a versão
        id: release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Forge Browser $tag" --notes "## 🔥 Forge Browser $tag`n`nAtualização oficial do Forge Browser.`n`n- Instalador Windows 64-bit`n- Atualização automática`n`n- Personalização Forge`n- Login com Google`n- Wallpapers animados" --latest
            "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "Release $tag já existe; não haverá novo upload para a mesma versão."
            "created=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: 🚀 Publicar release com atualização automática
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && steps.release.outputs.created == 'true')
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
