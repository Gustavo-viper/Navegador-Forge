name: Build Forge Browser

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔎 Verificar código
        run: npm run check

      - name: 🔨 Gerar instalador Forge Browser
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Salvar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBrowser-Windows
          path: dist/*.exe
          retention-days: 90

      - name: 🚀 Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Forge Browser ${{ github.ref_name }}
          body: |
            # 🔥 Forge Browser

            Navegador gamer oficial da Forge Studios.

            ## 🖥️ Windows

            Baixe o instalador abaixo e execute:

            `ForgeBrowser-Setup-*.exe`

            ## Requisitos

            - Windows 10 ou Windows 11
            - 64 bits

            ---
            **Forge Studios**
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
