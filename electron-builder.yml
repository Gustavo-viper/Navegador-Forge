appId: studios.forge.browser
productName: Forge Browser
copyright: Copyright (c) Forge Studios
asar: true
compression: maximum
npmRebuild: false
electronVersion: 41.10.7+wvcus
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/
electronLanguages:
  - en-US
  - pt-BR
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
extraMetadata:
  name: forge-browser
  main: electron/main.cjs
  version: 2.2.3
  description: Forge Browser by Forge Studios
  author: Forge Studios
publish:
  provider: github
  owner: Gustavo-viper
  repo: Navegador-Forge
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ForgeBrowser-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Forge Browser
  deleteAppDataOnUninstall: false
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  runAfterFinish: true
  menuCategory: Forge Studios
